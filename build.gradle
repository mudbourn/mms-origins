plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
    maven { url "https://api.modrinth.com/maven" }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    // Shared render infra, wired as a composite build (see settings.gradle). The
    // fur models are posed through its CEM/EMF pose relay.
    implementation "info.mudbourn:mms-render-common:${project.render_common_version}"

    // mms-combat's logout-body event and Mannequin body; compile-only and guarded
    // by isModLoaded at runtime, so this mod still loads without it.
    compileOnly "info.mudbourn:mms-combat:${project.mms_combat_version}"

    compileOnly files("libs/26.3/Origins-Legacy-1.12.20+26.3.jar")
    compileOnly files("libs/26.3/origins-legacy-classes-1.7.2+26.3.jar")
    // Origins: Legacy ships Apoli and Calio as nested jars, and nested jars are
    // not put on the compile classpath. Every power type we author is defined by
    // Apoli, so both have to be extracted from the Origins jar and added by hand.
    compileOnly files("libs/26.3/Apoli-Legacy-2.12.14+26.3.jar")
    compileOnly files("libs/26.3/Calio-Legacy-1.11.4+26.3.jar")
    // The Origins origin lives on a Cardinal Components component, whose key and
    // component types leak into the getter the fur mixin calls, so CCA has to be on
    // the compile classpath. The modrinth artifact ships the modules as nested jars,
    // and nested jars are not on the compile classpath, so the two the getter needs
    // are extracted by hand. Supplied at runtime as a dependency of Origins.
    compileOnly files("libs/26.3/cardinal-components-base-8.1.0.jar")
    compileOnly files("libs/26.3/cardinal-components-entity-8.1.0.jar")

    // Only for the Origins Classes / Jobs+ synergy line. Arc is Jobs+' own
    // holder framework and its types leak into the Jobs+ API we call, so it
    // has to be on the compile classpath alongside it.
    compileOnly files("libs/26.3/jobsplus-fabric-21.2.5.jar")
    compileOnly files("libs/26.3/arc-fabric-21.2.7.jar")
    // JobsPlusConfig exposes maxJobs/amountOfFreeJobs as yamlconfig entries, and
    // the auto-join has to read both to honour the same limits the jobs menu does.
    compileOnly files("libs/26.3/yamlconfig-fabric-22.1.0.jar")

    // Temperature source for the origins' heat and cold traits; both build on
    // the shared Thermoo API, supplied at runtime by the pack.
    compileOnly files("libs/26.3/scorchful-0.18.3+26.1.x.jar")
    compileOnly files("libs/26.3/frostiful-fabric-3.1.1+26.1.x.jar")
    compileOnly files("libs/26.3/thermoo-fabric-10.1.5.jar")
    compileOnly files("libs/26.3/yumi-commons-core-2.0.0.jar")
    compileOnly files("libs/26.3/yumi-commons-event-2.0.0.jar")

    // Friends and Foes' wildfire model, texture and sounds drawn for the Blazeborn's wildfire shield.
    compileOnly files("libs/26.3/friendsandfoes-fabric-5.0.5+mc26.3.jar")

    // Food-value event the client compat uses to show origin-modified nutrition.
    compileOnly files("libs/26.3/appleskin-fabric-mc26.3-3.0.10.jar")
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
    withSourcesJar()
}

processResources {
    inputs.property "mod_version", project.mod_version
    filesMatching("fabric.mod.json") {
        expand "version": project.mod_version
    }
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}

// Mixin claims every class under a config's `package` and refuses to load
// anything there as a normal class (IllegalClassLoadError). A plain helper put
// in a mixin package compiles and packages cleanly and only explodes the first
// time it is touched at runtime. Fail the build instead.
def checkMixinPackages = tasks.register('checkMixinPackages', Exec) {
    dependsOn tasks.named('jar')
    doFirst {
        commandLine 'python3',
                "$projectDir/gradle/scripts/check-mixin-packages.py",
                tasks.named('jar').get().archiveFile.get().asFile
    }
}

tasks.named('build') { dependsOn checkMixinPackages }
