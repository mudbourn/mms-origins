pluginManagement {
    repositories {
        maven { url = 'https://maven.fabricmc.net/' }
        mavenCentral()
        gradlePluginPortal()
    }
}

// The fur model layer is drawn through mms-render-common's CEM pose relay, wired
// in as a composite build so an edit upstream rebuilds here without a jar copy —
// and info.mudbourn:mms-render-common is not published to any Maven repo, so
// this substitution is the ONLY way that coordinate resolves.
//
// Locally the sibling sits next to this repo ('..'). CI checks siblings out into
// a workspace subdir and overrides the root with -PmmsSiblingRoot, since
// actions/checkout cannot write above $GITHUB_WORKSPACE. Keep the includeBuild
// path a quoted literal ending in the repo name: mms-repos.py and the reusable
// release workflow both discover sibling deps by reading exactly this line.
def siblingRoot = providers.gradleProperty('mmsSiblingRoot').getOrElse('..')
includeBuild "$siblingRoot/mms-render-common"
